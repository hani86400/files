<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Base64 Converter</title>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
    }

    #code_text {
        width: 100%;
        height: 200px;
        box-sizing: border-box;
    }

    #code_64 {
        width: 100%;
        margin-top: 10px;
        box-sizing: border-box;
    }

    #cvtcopy {
        margin-top: 10px;
        padding: 8px 16px;
        cursor: pointer;
    }
</style>
</head>
<body>

<textarea id="code_text" placeholder="Enter text here"></textarea>

<br>

<button id="cvtcopy">Convert and Copy</button>

<br>

<input type="text" id="code_64" placeholder="Base64 output">

<script>
document.getElementById('cvtcopy').addEventListener('click', async function () {

    const input = document.getElementById('code_text').value;

    // Supports UTF-8 text (Arabic, emojis, etc.)
    const base64 = btoa(
        new TextEncoder()
            .encode(input)
            .reduce((data, byte) => data + String.fromCharCode(byte), '')
    );

    const output = document.getElementById('code_64');
    output.value = base64;

    try {
        await navigator.clipboard.writeText(base64);
        console.log('Copied to clipboard');
    } catch (err) {
        output.select();
        document.execCommand('copy');
    }
});
</script>

</body>
</html>
