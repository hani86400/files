server {
    listen 80 default_server;
    server_name _;

    access_log /var/log/nginx/shared_access.log main;
    error_log  /var/log/nginx/shared_error.log warn;

    location /shared {
        root /srv;

        dav_methods PUT DELETE MKCOL COPY MOVE;
        create_full_put_path on;
        dav_access user:rw group:rw all:r;

        auth_basic "Shared Folder";
        auth_basic_user_file /etc/nginx/auth/app.htpasswd;

        client_max_body_size 2G;
    }

    location / {
        return 404;
    }
}

